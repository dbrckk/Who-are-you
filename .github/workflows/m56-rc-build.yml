name: M56 Release Candidate Build

on:
  push:
    branches:
      - m56-rc-build

permissions:
  contents: read

jobs:
  release_candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Repository verification tests
        run: PYTHONPATH=tools python -m unittest discover -s tools -p 'test_*.py'

      - name: JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Candidate lint
        run: gradle :app:lintCandidate --stacktrace

      - name: Build optimized installable candidate APK
        run: gradle :app:assembleCandidate --stacktrace

      - name: Verify candidate APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/candidate/app-candidate.apk"
          test -s "$APK"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee apk-signature.txt
          aapt dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.whoareyou.app' versionCode='1' versionName='0.1.0'" apk-badging.txt
          cp "$APK" who-are-you-0.1.0-rc.apk
          sha256sum who-are-you-0.1.0-rc.apk | tee who-are-you-0.1.0-rc.apk.sha256

      - name: Upload RC APK
        uses: actions/upload-artifact@v7
        with:
          name: who-are-you-0.1.0-rc
          path: |
            who-are-you-0.1.0-rc.apk
            who-are-you-0.1.0-rc.apk.sha256
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30
