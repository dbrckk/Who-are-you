name: Repository standards

on:
  push:
    branches: [main]
    paths-ignore:
      - ".ai/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-standards-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-standards:
    uses: dbrckk/repo-standards/.github/workflows/reusable-unified.yml@main
    with:
      # The 2026-10-28 generated map reached 1,512,872 bytes, above the
      # former 1,500,000-byte cap. Keep a bounded budget without truncating
      # source context or changing the shared standards workflow.
      ai_map_max_bytes: 1600000
