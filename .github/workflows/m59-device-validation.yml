name: M59 Android Device Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m59-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests and real-device smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          system-image-api-level: '35'
          emulator-build: '15004761'
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: bash .github/scripts/android-device-validation.sh

      - name: Upload device validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: who-are-you-device-validation-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            device-startup-*.txt
            device-monkey-*.txt
            device-logcat-*.txt
            device-android-runtime-*.txt
            device-exit-info-*.txt
            device-screen-*.png
            device-screen-report-*.txt
            device-ui-*.xml
            device-ui-report-*.txt
            device-display-metrics.txt
            device-display-*.txt
            device-motion-*.txt
            device-orientation-*.txt
            device-host-resources.txt
            device-host-kernel.txt
            device-validation-summary.txt
            device-visual-qa-summary.md
          if-no-files-found: warn
          retention-days: 14
