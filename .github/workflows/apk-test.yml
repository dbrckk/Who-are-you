name: Test APK (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          OUT="who-are-you-${VERSION_NAME}-${VERSION_CODE}-test.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          printf 'APK_NAME=%s\n' "$OUT" >> "$GITHUB_ENV"

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: who-are-you-${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
