name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate quiz catalog
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import re

          files = sorted(glob.glob('app/src/main/assets/quizzes*.json'))
          assert files, 'No quiz catalog assets found'

          def locale_for(path):
              name = os.path.basename(path)
              match = re.search(r'-(?P<locale>[a-z]{2})(?=\.json$)', name)
              return match.group('locale') if match else 'en'

          by_locale = {}
          for path in files:
              by_locale.setdefault(locale_for(path), []).append(path)

          locale_ids = {}
          locale_totals = {}

          for locale, locale_files in sorted(by_locale.items()):
              ids = set()
              total = 0
              for path in locale_files:
                  with open(path, encoding='utf-8') as handle:
                      payload = json.load(handle)
                  for quiz in payload.get('quizzes', []):
                      quiz_id = quiz['id']
                      assert quiz_id not in ids, f'{locale}: duplicate quiz id: {quiz_id}'
                      ids.add(quiz_id)
                      total += 1
                      assert len(quiz['questions']) >= 5, f'{locale}/{quiz_id}: expected at least 5 questions'
                      for index, question in enumerate(quiz['questions'], start=1):
                          answers = question['answers']
                          assert len(answers) == 4, f'{locale}/{quiz_id} Q{index}: expected 4 answers'
                          scores = sorted(answer['score'] for answer in answers)
                          assert scores == [0, 1, 2, 3], f'{locale}/{quiz_id} Q{index}: scores must be 0,1,2,3'

              locale_ids[locale] = ids
              locale_totals[locale] = total
              print(f'Validated {total} {locale} quizzes across {len(locale_files)} asset files')

          english_ids = locale_ids.get('en', set())
          french_ids = locale_ids.get('fr', set())
          english_total = locale_totals.get('en', 0)
          french_total = locale_totals.get('fr', 0)

          assert english_total >= 30, f'Expected at least 30 English quizzes, found {english_total}'
          assert french_total >= 30, f'Expected at least 30 French quizzes, found {french_total}'
          assert french_ids == english_ids, (
              f'FR/EN quiz IDs differ. Missing in FR: {sorted(english_ids - french_ids)}; '
              f'unknown in FR: {sorted(french_ids - english_ids)}'
          )
          print(f'Bilingual catalog parity confirmed: {english_total} EN / {french_total} FR')
          PY

      - name: Validate release configuration
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          ad_manager = Path('app/src/main/java/com/whoareyou/app/AdManager.kt').read_text(encoding='utf-8')
          billing = Path('app/src/main/java/com/whoareyou/app/BillingManager.kt').read_text(encoding='utf-8')
          contract = json.loads(Path('docs/internal-test-release.json').read_text(encoding='utf-8'))
          play = json.loads(Path('docs/play-internal-test-metadata.json').read_text(encoding='utf-8'))

          def expect(pattern, value, source=gradle):
              assert re.search(pattern, source), f'Missing locked release value: {value}'

          expect(r'applicationId\s*=\s*"com\.whoareyou\.app"', 'applicationId')
          expect(r'minSdk\s*=\s*26\b', 'minSdk')
          expect(r'targetSdk\s*=\s*36\b', 'targetSdk')
          expect(r'compileSdk\s*=\s*37\b', 'compileSdk')
          expect(r'versionCode\s*=\s*1\b', 'versionCode')
          expect(r'versionName\s*=\s*"0\.1\.0"', 'versionName')
          expect(r'isMinifyEnabled\s*=\s*false', 'release minify setting')

          assert contract['applicationId'] == 'com.whoareyou.app'
          assert contract['versionCode'] == 1
          assert contract['versionName'] == '0.1.0'
          assert contract['minSdk'] == 26
          assert contract['targetSdk'] == 36
          assert contract['compileSdk'] == 37
          assert contract['release']['minifyEnabled'] is False
          assert contract['release']['artifact'] == 'app/build/outputs/bundle/release/app-release.aab'
          assert contract['release']['githubArtifactName'] == 'who-are-you-release-aab'

          assert play['track'] == 'internal'
          assert play['applicationId'] == contract['applicationId']
          assert play['versionCode'] == contract['versionCode']
          assert play['versionName'] == contract['versionName']
          assert play['containsAds'] is True
          assert play['accountRequired'] is False
          assert play['billingProducts'] == [{'id': 'remove_ads_lifetime', 'type': 'one_time'}]
          for path in (
              play['listing']['englishSource'],
              play['listing']['frenchSource'],
              play['listing']['releaseNotesSource'],
              play['privacy']['policySource'],
              play['privacy']['dataSafetyWorksheet'],
              'docs/m28-play-internal-submission.md'
          ):
              assert Path(path).is_file(), f'Missing Play submission source: {path}'
          assert play['privacy']['publicHttpsUrlRequired'] is True
          assert play['privacy']['supportContactRequired'] is True
          assert set(play['assetsRequired']) == {'app_icon', 'phone_screenshots', 'feature_graphic'}

          assert 'WHO_ARE_YOU_ADMOB_APP_ID' in gradle
          assert 'WHO_ARE_YOU_ADMOB_INTERSTITIAL_ID' in gradle
          assert 'WHO_ARE_YOU_TELEMETRY_ENDPOINT' in gradle
          assert 'telemetryEndpoint.startsWith("https://")' in gradle, 'Configured telemetry must require HTTPS'
          assert '${admobAppId}' in manifest
          assert 'BuildConfig.ADMOB_INTERSTITIAL_ID' in ad_manager
          assert 'ca-app-pub-3940256099942544~3347511713' in gradle, 'Missing safe development AdMob fallback'
          assert 'ca-app-pub-3940256099942544/1033173712' in gradle, 'Missing safe development interstitial fallback'

          assert 'const val REMOVE_ADS_PRODUCT_ID = "remove_ads_lifetime"' in billing
          assert contract['billing']['removeAdsProductId'] == 'remove_ads_lifetime'

          permissions = re.findall(r'<uses-permission\s+android:name="([^"]+)"\s*/>', manifest)
          assert permissions == ['android.permission.INTERNET'], f'Unexpected app-level permissions: {permissions}'
          assert contract['network']['appPermissions'] == ['android.permission.INTERNET']

          assert 'android:autoVerify="true"' in manifest, 'HTTPS App Link must request automatic verification'
          assert 'android:host="dbrckk.github.io"' in manifest
          assert 'android:pathPrefix="/Who-are-you/challenge/"' in manifest
          assert contract['appLinks']['host'] == 'dbrckk.github.io'
          assert contract['appLinks']['pathPrefix'] == '/Who-are-you/challenge/'
          assert contract['appLinks']['autoVerify'] is True

          print('Locked internal Play submission contract confirmed: com.whoareyou.app 0.1.0 (1)')
          PY

      - name: JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK, release APK and release AAB
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release AAB
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: who-are-you-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
