name: M34 Shell Integrator

on:
  push:
    branches: [main]
    paths:
      - "tools/m34_apply_shell.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply shell integration
        run: python3 tools/m34_apply_shell.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No shell integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/whoareyou/app/MainActivity.kt
          git commit -m "M34 integrate persistent Discover Profile shell"
          git push
