<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#090A0F" />
  <title>Who Are You? — Friend Challenge</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #090A0F; color: #fff; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); }
    .eyebrow { color: #9C7BFF; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 12px 0 10px; font-size: clamp(38px, 10vw, 64px); line-height: .98; }
    .sub { color: #A4A7B5; font-size: 17px; line-height: 1.5; }
    .card { margin-top: 28px; padding: 24px; border-radius: 28px; background: #14151D; }
    .card strong { color: #6EE7F9; }
    .actions { display: grid; gap: 12px; margin-top: 24px; }
    a { display: block; text-align: center; text-decoration: none; border-radius: 18px; padding: 17px 18px; font-weight: 900; }
    .primary { background: #9C7BFF; color: #090A0F; }
    .secondary { background: #1B1D27; color: #fff; }
    .fine { margin-top: 22px; color: #747887; font-size: 12px; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">WHO ARE YOU?</div>
  <h1>You’ve been challenged.</h1>
  <p class="sub">Take the same personality test, then compare your scores instantly.</p>
  <section class="card">
    <div id="challengeText">A friend sent you a challenge.</div>
    <div class="actions">
      <a id="openApp" class="primary" href="#">OPEN IN APP</a>
      <a id="installApp" class="secondary" href="https://play.google.com/store/apps/details?id=com.whoareyou.app">GET THE APP</a>
    </div>
  </section>
  <div class="fine">For entertainment and self-reflection only — not a psychological diagnosis.</div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const quiz = params.get('quiz') || '';
  const score = params.get('score') || '';
  const validScore = /^\d{1,3}$/.test(score) && Number(score) >= 0 && Number(score) <= 100;
  const validQuiz = /^[a-z0-9_\-]{1,80}$/i.test(quiz);

  const appUri = validQuiz && validScore
    ? `whoareyou://challenge?quiz=${encodeURIComponent(quiz)}&score=${encodeURIComponent(score)}`
    : 'whoareyou://challenge';

  const openApp = document.getElementById('openApp');
  openApp.href = appUri;

  if (validQuiz && validScore) {
    document.getElementById('challengeText').innerHTML = `Challenge ready. <strong>Open the app</strong> to take the test and reveal your match.`;
  }

  openApp.addEventListener('click', () => {
    setTimeout(() => {
      if (document.visibilityState === 'visible') {
        document.getElementById('installApp').focus();
      }
    }, 1400);
  });
</script>
</body>
</html>
