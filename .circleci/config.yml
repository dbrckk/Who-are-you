version: 2.1

jobs:
  android-quality:
    docker:
      - image: cimg/android:2026.08.1
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
    steps:
      - checkout

      - run:
          name: Install pinned Gradle 9.5
          command: |
            curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "$HOME"
            echo 'export PATH="$HOME/gradle-9.5.0/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            gradle --version

      - run:
          name: Install required Android SDK packages
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - run:
          name: Python quality contracts
          command: PYTHONPATH=tools python3 -m unittest discover -s tools -p 'test_*.py'

      - run:
          name: JVM unit tests
          command: gradle :app:testDebugUnitTest --stacktrace

      - run:
          name: Android lint
          command: gradle :app:lintDebug --stacktrace

      - run:
          name: Compile instrumentation tests
          command: gradle :app:assembleDebugAndroidTest --stacktrace

      - store_test_results:
          path: app/build/test-results

      - store_artifacts:
          path: app/build/reports
          destination: reports

workflows:
  quality:
    jobs:
      - android-quality
