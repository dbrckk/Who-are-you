version: 2.1

jobs:
  release_candidate:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
    steps:
      - checkout

      - run:
          name: Install Android SDK 37 and Gradle 9.5
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-37" "build-tools;37.0.0"
            curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo 'export PATH=/tmp/gradle-9.5.0/bin:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            gradle --version

      - run:
          name: Repository verification tests
          command: PYTHONPATH=tools python -m unittest discover -s tools -p 'test_*.py'

      - run:
          name: Android verification
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            gradle :app:testDebugUnitTest --stacktrace
            gradle :app:assembleDebugAndroidTest --stacktrace
            gradle :app:lintCandidate --stacktrace
            gradle :app:lintRelease --stacktrace

      - run:
          name: Build release candidate APK and release AAB
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            gradle :app:assembleCandidate --stacktrace
            gradle :app:bundleRelease --stacktrace

      - run:
          name: Verify and package release candidate
          command: |
            set -euo pipefail
            APK="app/build/outputs/apk/candidate/app-candidate.apk"
            test -s "$APK"
            zipalign -c -v 4 "$APK"
            apksigner verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
            aapt dump badging "$APK" | tee /tmp/apk-badging.txt
            grep -F "package: name='com.whoareyou.app' versionCode='1' versionName='0.1.0'" /tmp/apk-badging.txt
            grep -F "sdkVersion:'26'" /tmp/apk-badging.txt
            grep -F "targetSdkVersion:'36'" /tmp/apk-badging.txt

            mkdir -p dist
            cp "$APK" dist/who-are-you-0.1.0-rc.apk
            sha256sum dist/who-are-you-0.1.0-rc.apk > dist/who-are-you-0.1.0-rc.apk.sha256
            cp /tmp/apk-signature.txt dist/who-are-you-0.1.0-rc.apk.signature.txt
            cp /tmp/apk-badging.txt dist/who-are-you-0.1.0-rc.apk.badging.txt

            mapfile -t bundles < <(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print)
            test "${#bundles[@]}" -eq 1
            cp "${bundles[0]}" dist/who-are-you-0.1.0-release-unsigned.aab
            sha256sum dist/who-are-you-0.1.0-release-unsigned.aab > dist/who-are-you-0.1.0-release-unsigned.aab.sha256

      - store_test_results:
          path: app/build/test-results

      - store_artifacts:
          path: dist
          destination: android

workflows:
  android:
    jobs:
      - release_candidate:
          filters:
            branches:
              only: main
